<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario EPP y Seguridad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--azul:#0058A3;--amarillo:#FFDA1A;}
body{background:#eef3f8;font-family:Segoe UI,sans-serif}
.sidebar{background:var(--azul);color:#fff;min-height:100vh;padding:20px}
.logo{font-size:1.5rem;font-weight:700}
.card-stat{border:none;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card-prod{border:none;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:.2s}
.card-prod:hover{transform:translateY(-4px)}
.badge-cat{background:var(--azul)}
.btn-primary{background:var(--azul);border:none}
.btn-warning{background:var(--amarillo);border:none}
.stock-critico{color:#dc3545;font-weight:bold}
.stock-ok{color:#198754;font-weight:bold}
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
<div class="col-md-2 sidebar">
<div class="logo"><i class="fa-solid fa-boxes-stacked"></i> Inventario</div>
<hr>
<p>EPP y Elementos de Seguridad</p>
</div>
<div class="col-md-10 p-4">
<h2 class="mb-4">📦 Inventario EPP y Seguridad</h2>
<div class="row mb-4">
<div class="col-md-4"><div class="card card-stat"><div class="card-body"><h6>Productos</h6><h2 id="total"></h2></div></div></div>
<div class="col-md-4"><div class="card card-stat"><div class="card-body"><h6>Stock Total</h6><h2 id="stockTotal"></h2></div></div></div>
<div class="col-md-4"><div class="card card-stat"><div class="card-body"><h6>Críticos</h6><h2 id="criticos"></h2></div></div></div>
</div>
<div class="row mb-3">
<div class="col-md-6"><input id="buscar" class="form-control" placeholder="Buscar producto" onkeyup="render()"></div>
<div class="col-md-3"><select id="filtro" class="form-select" onchange="render()"><option value=''>Todas las categorías</option><option>EPP</option><option>Elementos de Seguridad</option></select></div>
</div>
<div class="row" id="productos"></div>
</div>
</div>
</div>
<script>
let inventario=[
{cat:'EPP',nombre:'Casco de seguridad',stock:20,min:5},
{cat:'EPP',nombre:'Chaleco reflectante',stock:20,min:5},
{cat:'EPP',nombre:'Guantes anticorte',stock:20,min:5},
{cat:'EPP',nombre:'Guantes de nitrilo',stock:20,min:5},
{cat:'EPP',nombre:'Lentes de seguridad',stock:20,min:5},
{cat:'EPP',nombre:'Zapatos de seguridad',stock:20,min:5},
{cat:'EPP',nombre:'Arnés de seguridad',stock:20,min:5},
{cat:'EPP',nombre:'Protector auditivo',stock:20,min:5},
{cat:'EPP',nombre:'Guante de cabretilla',stock:20,min:5},
{cat:'EPP',nombre:'Barbiquejo',stock:20,min:5},
{cat:'Elementos de Seguridad',nombre:'Cono de seguridad',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Cinta de peligro',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Botiquín',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Linterna',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Barreras divisorias',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Cinta doble contacto',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Cinta delimitadora',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Cuñas',stock:10,min:3},
{cat:'Elementos de Seguridad',nombre:'Cuchillo microdentado',stock:10,min:3}
];
function guardar(){localStorage.setItem('inventarioEPP',JSON.stringify(inventario));}
if(localStorage.getItem('inventarioEPP')) inventario=JSON.parse(localStorage.getItem('inventarioEPP'));
function mov(i,t){let c=parseInt(prompt('Cantidad')); if(isNaN(c)||c<=0)return; if(t==='salida'&&c>inventario[i].stock){alert('Stock insuficiente');return;} t==='entrada'?inventario[i].stock+=c:inventario[i].stock-=c; guardar(); render();}
function render(){let b=buscar.value.toLowerCase(),f=filtro.value; let html=''; inventario.forEach((p,i)=>{if(!p.nombre.toLowerCase().includes(b))return; if(f&&p.cat!==f)return; html+=`<div class='col-md-4 mb-3'><div class='card card-prod'><div class='card-body'><span class='badge badge-cat'>${p.cat}</span><h5 class='mt-2'>${p.nombre}</h5><p class='${p.stock<=p.min?'stock-critico':'stock-ok'}'>Stock: ${p.stock}</p><button class='btn btn-primary w-100 mb-2' onclick='mov(${i},"entrada")'>➕ Ingreso</button><button class='btn btn-warning w-100' onclick='mov(${i},"salida")'>➖ Salida</button></div></div></div>`});
productos.innerHTML=html;
document.getElementById('total').innerHTML=inventario.length;
document.getElementById('stockTotal').innerHTML=inventario.reduce((a,b)=>a+b.stock,0);
document.getElementById('criticos').innerHTML=inventario.filter(x=>x.stock<=x.min).length;
}
render();
</script>
</body></html>
