<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario EPP Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{--azul:#0058A3;--amarillo:#FFDA1A}.dark{background:#1f2937;color:#fff}.dark .card{background:#374151;color:#fff}body{background:#eef2f7}.sidebar{background:var(--azul);min-height:100vh;color:#fff}.card{border:none;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.1)}.menu{padding:10px}.prod{margin-bottom:15px}.crit{color:red;font-weight:bold}.ok{color:green;font-weight:bold}</style></head><body><div class='container-fluid'><div class='row'><div class='col-md-2 sidebar p-3'><h4>🟦 IKEA Seguridad</h4><hr><div class='menu'>📊 Dashboard</div><div class='menu'>📦 Inventario</div><div class='menu'>📋 Movimientos</div><button class='btn btn-warning w-100 mt-3' onclick='toggleDark()'>🌙 Modo Oscuro</button><button class='btn btn-light w-100 mt-2' onclick='exportar()'>📥 Exportar CSV</button></div><div class='col-md-10 p-4'><h2>Inventario EPP y Seguridad</h2><div class='row mb-3'><div class='col'><div class='card p-3'><h6>Productos</h6><h2 id=t1></h2></div></div><div class='col'><div class='card p-3'><h6>Stock Total</h6><h2 id=t2></h2></div></div><div class='col'><div class='card p-3'><h6>Críticos</h6><h2 id=t3></h2></div></div></div><div class='card p-3 mb-3'><h5>Nuevo Producto</h5><div class='row'><div class='col'><input id=cod class='form-control' placeholder='Código'></div><div class='col'><select id=cat class='form-select'><option>EPP</option><option>Elementos de Seguridad</option></select></div><div class='col'><input id=nom class='form-control' placeholder='Producto'></div><div class='col'><input id=stk type=number class='form-control' placeholder='Stock'></div><div class='col'><input id=min type=number class='form-control' placeholder='Mínimo'></div><div class='col'><button class='btn btn-primary' onclick='add()'>Agregar</button></div></div></div><input id=bus class='form-control mb-3' placeholder='Buscar' onkeyup='render()'><div id=productos class='row'></div><div class='card p-3 mt-3'><h5>Historial de Movimientos</h5><table class='table'><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Motivo</th></tr></thead><tbody id=hist></tbody></table></div></div></div></div><script>let p=JSON.parse(localStorage.getItem('prod')||'null')||[{c:'EPP001',cat:'EPP',n:'Casco de seguridad',s:20,m:5},{c:'EPP002',cat:'EPP',n:'Chaleco reflectante',s:20,m:5},{c:'EPP003',cat:'EPP',n:'Guantes anticorte',s:20,m:5},{c:'EPP004',cat:'EPP',n:'Guantes de nitrilo',s:20,m:5},{c:'EPP005',cat:'EPP',n:'Lentes de seguridad',s:20,m:5},{c:'EPP006',cat:'EPP',n:'Zapatos de seguridad',s:20,m:5},{c:'EPP007',cat:'EPP',n:'Arnés de seguridad',s:20,m:5},{c:'EPP008',cat:'EPP',n:'Protector auditivo',s:20,m:5},{c:'EPP009',cat:'EPP',n:'Guante de cabretilla',s:20,m:5},{c:'EPP010',cat:'EPP',n:'Barbiquejo',s:20,m:5},{c:'SEG001',cat:'Elementos de Seguridad',n:'Cono de seguridad',s:10,m:3},{c:'SEG002',cat:'Elementos de Seguridad',n:'Cinta de peligro',s:10,m:3},{c:'SEG003',cat:'Elementos de Seguridad',n:'Botiquín',s:10,m:3},{c:'SEG004',cat:'Elementos de Seguridad',n:'Linterna',s:10,m:3},{c:'SEG005',cat:'Elementos de Seguridad',n:'Barreras divisorias',s:10,m:3},{c:'SEG006',cat:'Elementos de Seguridad',n:'Cinta doble contacto',s:10,m:3},{c:'SEG007',cat:'Elementos de Seguridad',n:'Cinta delimitadora',s:10,m:3},{c:'SEG008',cat:'Elementos de Seguridad',n:'Cuñas',s:10,m:3},{c:'SEG009',cat:'Elementos de Seguridad',n:'Cuchillo microdentado',s:10,m:3}];let h=JSON.parse(localStorage.getItem('hist')||'[]');function save(){localStorage.setItem('prod',JSON.stringify(p));localStorage.setItem('hist',JSON.stringify(h));}function add(){p.push({c:cod.value,cat:cat.value,n:nom.value,s:+stk.value,m:+min.value});save();render()}function mov(i,t){let c=+prompt('Cantidad');if(!c)return;let motivo=prompt('Motivo: Entrega, Reposición, Pérdida, Deterioro u Otro');if(t=='salida'&&c>p[i].s)return alert('Stock insuficiente');t=='entrada'?p[i].s+=c:p[i].s-=c;h.unshift({f:new Date().toLocaleString(),p:p[i].n,t,c,m:motivo});save();render()}function delp(i){if(confirm('Eliminar producto?')){p.splice(i,1);save();render()}}function editMin(i){let v=+prompt('Nuevo stock mínimo',p[i].m);if(v>=0){p[i].m=v;save();render()}}function render(){let b=(bus.value||'').toLowerCase();productos.innerHTML='';p.filter(x=>x.n.toLowerCase().includes(b)).forEach((x,i)=>productos.innerHTML+=`<div class='col-md-4 prod'><div class='card p-3'><small>${x.c}</small><span class='badge bg-primary'>${x.cat}</span><h5>${x.n}</h5><div class='${x.s<=x.m?'crit':'ok'}'>Stock ${x.s}</div><small>Mínimo ${x.m}</small><button class='btn btn-success btn-sm mt-2' onclick='mov(${i},"entrada")'>➕ Ingreso</button><button class='btn btn-warning btn-sm mt-2' onclick='mov(${i},"salida")'>➖ Salida</button><button class='btn btn-secondary btn-sm mt-2' onclick='editMin(${i})'>⚙️ Mínimo</button><button class='btn btn-danger btn-sm mt-2' onclick='delp(${i})'>🗑 Eliminar</button></div></div>`);t1.innerText=p.length;t2.innerText=p.reduce((a,b)=>a+b.s,0);t3.innerText=p.filter(x=>x.s<=x.m).length;hist.innerHTML=h.map(x=>`<tr><td>${x.f}</td><td>${x.p}</td><td>${x.t}</td><td>${x.c}</td><td>${x.m}</td></tr>`).join('')}function toggleDark(){document.body.classList.toggle('dark')}function exportar(){let csv='Codigo,Categoria,Producto,Stock,Minimo
'+p.map(x=>`${x.c},${x.cat},${x.n},${x.s},${x.m}`).join('
');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='inventario.csv';a.click()}render();</script></body></html>
