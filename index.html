<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario EPP Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--azul:#0058A3;--amarillo:#FFDA1A}body{background:#eef2f7}.sidebar{background:var(--azul);min-height:100vh;color:#fff}.menu-item{cursor:pointer;padding:12px;border-radius:8px}.menu-item:hover,.active{background:rgba(255,255,255,.15)}.card{border:0;border-radius:16px}.hidden{display:none}.dark{background:#1f2937;color:#fff}.dark .card{background:#374151;color:#fff}
</style></head><body>
<div class='container-fluid'><div class='row'>
<div class='col-md-2 sidebar p-3'>
<h3>IKEA Seguridad</h3><hr>
<div class='menu-item active' onclick='showView("dashboard",this)'>📊 Dashboard</div>
<div class='menu-item' onclick='showView("inventario",this)'>📦 Inventario</div>
<div class='menu-item' onclick='showView("movimientos",this)'>📋 Movimientos</div>
<button class='btn btn-warning w-100 mt-3' onclick='toggleDark()'>🌙 Modo oscuro</button>
<button class='btn btn-light w-100 mt-2' onclick='exportCSV()'>📥 Exportar CSV</button>
</div>
<div class='col-md-10 p-4'>
<div id='dashboard'>
<h2>Dashboard</h2><div class='row'>
<div class='col'><div class='card p-3'><h6>Productos</h6><h2 id='totalProd'></h2></div></div>
<div class='col'><div class='card p-3'><h6>Stock Total</h6><h2 id='stockTot'></h2></div></div>
<div class='col'><div class='card p-3'><h6>Críticos</h6><h2 id='criticos'></h2></div></div>
</div></div>
<div id='inventario' class='hidden'>
<h2>Inventario</h2>
<div class='card p-3 mb-3'><div class='row'>
<div class='col'><input id='cod' class='form-control' placeholder='Código'></div>
<div class='col'><select id='cat' class='form-select'><option>EPP</option><option>Elementos de Seguridad</option></select></div>
<div class='col'><input id='nom' class='form-control' placeholder='Producto'></div>
<div class='col'><input id='stk' type='number' class='form-control' placeholder='Stock'></div>
<div class='col'><input id='min' type='number' class='form-control' placeholder='Mínimo'></div>
<div class='col'><button class='btn btn-primary' onclick='agregarProducto()'>Agregar</button></div>
</div></div>
<input id='buscar' class='form-control mb-3' placeholder='Buscar...' onkeyup='render()'>
<div class='row' id='productos'></div>
</div>
<div id='movimientos' class='hidden'>
<h2>Movimientos</h2>
<table class='table'><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th></tr></thead><tbody id='historial'></tbody></table>
</div></div></div></div>
<script>
let productos=JSON.parse(localStorage.getItem('productos')||'null')||[
{c:'EPP001',cat:'EPP',n:'Casco de seguridad',s:20,m:5},
{c:'EPP002',cat:'EPP',n:'Guantes anticorte',s:20,m:5},
{c:'SEG001',cat:'Elementos de Seguridad',n:'Cono de seguridad',s:10,m:3}
];
let movimientos=JSON.parse(localStorage.getItem('movimientos')||'[]');
function save(){localStorage.setItem('productos',JSON.stringify(productos));localStorage.setItem('movimientos',JSON.stringify(movimientos));}
function showView(id,el){document.querySelectorAll('#dashboard,#inventario,#movimientos').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.menu-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
function agregarProducto(){const p={c:cod.value,cat:cat.value,n:nom.value,s:Number(stk.value),m:Number(min.value)};if(!p.c||!p.n)return alert('Complete Código y Producto');productos.push(p);save();render();alert('Producto agregado');}
function mover(i,t){let c=Number(prompt('Cantidad'));if(!c)return;let motivo=prompt('Motivo');if(t==='Salida'&&c>productos[i].s)return alert('Stock insuficiente');t==='Ingreso'?productos[i].s+=c:productos[i].s-=c;movimientos.unshift({f:new Date().toLocaleString(),p:productos[i].n,t,c,m:motivo});save();render();}
function render(){let b=(document.getElementById('buscar')?.value||'').toLowerCase();let cont=document.getElementById('productos');cont.innerHTML='';productos.filter(x=>x.n.toLowerCase().includes(b)).forEach((x,i)=>{cont.innerHTML+=`<div class='col-md-4 mb-3'><div class='card p-3'><b>${x.n}</b><small>${x.c} | ${x.cat}</small><p>Stock: ${x.s} | Min: ${x.m}</p><button class='btn btn-success btn-sm' onclick='mover(${i},"Ingreso")'>Ingreso</button> <button class='btn btn-warning btn-sm' onclick='mover(${i},"Salida")'>Salida</button></div></div>`});
 document.getElementById('totalProd').innerText=productos.length;document.getElementById('stockTot').innerText=productos.reduce((a,b)=>a+b.s,0);document.getElementById('criticos').innerText=productos.filter(x=>x.s<=x.m).length;
 document.getElementById('historial').innerHTML=movimientos.map(x=>`<tr><td>${x.f}</td><td>${x.p}</td><td>${x.t}</td><td>${x.c}</td><td>${x.m}</td></tr>`).join('');}
function toggleDark(){document.body.classList.toggle('dark')}
function exportCSV(){let csv='Codigo,Categoria,Producto,Stock,Minimo
'+productos.map(x=>`${x.c},${x.cat},${x.n},${x.s},${x.m}`).join('
');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='inventario.csv';a.click();}
render();
</script></body></html>
